name: image

on:
  workflow_dispatch:
    inputs:
      prover_build_id:
        required: true
        type: string
      proof_version:
        required: true
        type: string
      virtual_program_hash:
        required: true
        type: string
      starknet_os_config_hash:
        required: true
        type: string

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write

jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
      - env:
          PROVER_BUILD_ID: ${{ inputs.prover_build_id }}
          PROOF_VERSION: ${{ inputs.proof_version }}
          VIRTUAL_PROGRAM_HASH: ${{ inputs.virtual_program_hash }}
          STARKNET_OS_CONFIG_HASH: ${{ inputs.starknet_os_config_hash }}
        run: |
          [[ "$PROVER_BUILD_ID" =~ ^[A-Za-z0-9._-]{1,64}$ ]]
          [[ "$PROOF_VERSION" =~ ^[A-Za-z0-9._-]{1,64}$ ]]
          [[ "$VIRTUAL_PROGRAM_HASH" =~ ^0x[0-9a-f]{1,64}$ ]]
          [[ "$STARKNET_OS_CONFIG_HASH" =~ ^0x[0-9a-f]{1,64}$ ]]
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: .
          file: proof_worker/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ghcr.io/zylithfi/prover:${{ inputs.prover_build_id }}-${{ github.sha }}
          build-args: |
            PROVER_BUILD_ID=${{ inputs.prover_build_id }}
            PROOF_VERSION=${{ inputs.proof_version }}
            VIRTUAL_PROGRAM_HASH=${{ inputs.virtual_program_hash }}
            STARKNET_OS_CONFIG_HASH=${{ inputs.starknet_os_config_hash }}
      - uses: actions/attest-build-provenance@43d14bc2b83dec42d39ecae14e916627a18bb661
        with:
          subject-name: ghcr.io/zylithfi/prover
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
