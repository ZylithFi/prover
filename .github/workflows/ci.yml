name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: dtolnay/rust-toolchain@ebb3d1676050bfd0971c36c1e215b5751473994d
      - run: |
          cargo fmt --all --check
          cargo clippy --workspace --all-targets -- -D warnings
          cargo test --workspace
          cargo build --locked --release -p zylith-proof-worker
      - run: |
          node --check proof_worker/run.mjs
          cp proof_worker/.env.example proof_worker/.env
          ZYLITH_PROOF_WORKER_IMAGE=ghcr.io/zylithfi/prover@sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa \
          ZYLITH_STWO_IMAGE=ghcr.io/starkware-libs/starknet-privacy/transaction-prover@sha256:bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb \
          ZYLITH_PROOF_WORKER_REGISTRATION_TOKEN=ci-registration-token \
          ZYLITH_PROVER_BUILD_ID=ci-build \
          ZYLITH_PROOF_VERSION=ci-proof \
          ZYLITH_VIRTUAL_PROGRAM_HASH=0x1 \
          ZYLITH_STARKNET_OS_CONFIG_HASH=0x2 \
            docker compose -f proof_worker/compose.yml config >/dev/null
